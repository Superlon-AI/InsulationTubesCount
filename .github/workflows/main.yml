name: Push AI to Replicate

on:
  workflow_dispatch:  # 允许手动点击运行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 下载仓库小文件
        uses: actions/checkout@v4

      - name: 自动下载大模型 best.pt
        run: wget -O best.pt "https://github.com/Superlon-AI/InsulationTubesCount/releases/download/v1.0/best.pt"

      - name: 安装打包引擎并登录
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: 终极大发射！
        run: cog push r8.im/superlon-ai/insulation-tube-counter
